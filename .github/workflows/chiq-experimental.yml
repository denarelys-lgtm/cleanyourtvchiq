name: CHiQ AI PONT SA experimental build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build and test CHiQ experimental APK
        run: |
          chmod +x ./gradlew ./scripts/build-chiq-ai-pont-sa-experimental.sh
          ./scripts/build-chiq-ai-pont-sa-experimental.sh

      - name: Upload experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-CHiQ-AI-PONT-SA-0.4.8-alpha1
          path: app/build/outputs/apk/full/debug/app-full-debug.apk
          if-no-files-found: error
          retention-days: 14
